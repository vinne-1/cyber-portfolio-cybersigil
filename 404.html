<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect trick
        // Converts path to a query param so index.html can restore it
        var path = window.location.pathname;
        var search = window.location.search;
        var basePath = window.location.hostname === 'vinne-1.github.io' ? '/cyber-portfolio-cybersigil' : '';
        window.location.replace(
            window.location.origin + basePath + '/?p=' +
            encodeURIComponent(path.replace(basePath, '')) +
            (search ? '&q=' + encodeURIComponent(search.slice(1)) : '')
        );
    </script>
</head>
<body>
    <p>Redirecting&hellip;</p>
    <noscript>
        <p>JavaScript is required to redirect you automatically.</p>
        <p><a href="https://vineedoesstuff.in/">Go to the homepage</a></p>
    </noscript>
</body>
</html>
