name: Update Threat Feed

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-threat-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps (rss-parser etc.)
        working-directory: backend
        run: npm ci
      - name: Generate threat-feed.json
        run: node scripts/generate-threat-feed.js
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/threat-feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update threat feed data [automated]"
          git push
