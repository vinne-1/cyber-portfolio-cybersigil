name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html app.js style.css sw.js _site/
          cp 404.html sitemap.xml manifest.json og-image.png robots.txt _site/
          cp resume.pdf "CompTIA Security+ ce certificate.pdf" _site/ 2>/dev/null || true
          cp -r resources _site/ 2>/dev/null || true
          cp -r data _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || true
      - name: Cache-bust style.css / app.js
        run: |
          SHA_SHORT="${GITHUB_SHA:0:8}"
          sed -i -E "s/(style\.css|app\.js)(\?v=[A-Za-z0-9]+)?\"/\1?v=${SHA_SHORT}\"/g" _site/index.html
          grep -o 'style\.css?v=[A-Za-z0-9]*\|app\.js?v=[A-Za-z0-9]*' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
